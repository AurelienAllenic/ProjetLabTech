name: CI — Lint, Tests & Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ci:
    name: Lint · Tests · Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FRONT

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: FRONT/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests unitaires & intégration
        run: npm run test

      - name: Build de production
        run: npm run build
